# Derived from the original project metadata of ssn-hop-reconstruction 0.1.0: the test extra and the pytest section are removed (no tests in this folder); the optional extra "plot" is added.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssn-hop-reconstruction"
version = "0.1.0"
description = "Independent, assumption-labeled fixed-N satellite hop regression reconstruction"
requires-python = ">=3.10,<3.15"
dependencies = ["numpy>=1.26,<3", "torch>=2.6,<3", "torch-geometric>=2.6.1,<3"]

[project.optional-dependencies]
plot = ["matplotlib"]

[project.scripts]
ssn-hop = "ssn_hops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
