# config.yaml - настройки для experiments/run_all.py
# Файл в кодировке UTF-8 (в VS Code это значение по умолчанию). Комментарии на русском языке допустимы:
# скрипт читает файл как UTF-8.
#
# СТАТУС: НИЧЕГО из этого авторы не запускали. Первый ваш запуск - это первая проверка.
#
# Для чтения .yaml нужен пакет PyYAML:  pip install pyyaml
# Без PyYAML используйте близнеца без комментариев:  python experiments/run_all.py --config config.example.json
# Неизвестный ключ в этом файле считается ошибкой (так ловятся опечатки).
#
# ВАЖНО О РАЗМЕРЕ ЗАПУСКА (прочитайте до начала):
#   * Поставляемый набор (suite) планирует 11 различных точек (n, p); на каждую приходится по 5 кортежей зёрен,
#     то есть 55 сценариев. При 4 политиках это 220 ячеек симуляции, плюс 5 обучений (N от 132 до 396).
#     CGR входит в каждую ячейку. Все числа в этом абзаце - ручная арифметика по составу набора, а не результат прогона.
#   * Стадия execute запускает ячейки строго одну за другой, без ограничений по времени
#     (никаких «cap»), без возобновления (resume) и без собственного вывода о ходе работы.
#     Скрипт run_all.py сам печатает строку [heartbeat] раз в run.progress_interval_s секунд.
#   * Прерванный запуск продолжить нельзя: каталог вывода нужно удалить вручную (скрипт ничего не удаляет)
#     или выбрать другой output_root.
#   * Время полного прогона такого объёма не измерено; для вашего компьютера никаких обещаний нет.
#     ОЦЕНКА времени существует и помечена как ОЦЕНКА в README.md; её числа здесь не повторяются.
#
# --- Ключи ------------------------------------------------------------------

# revision - ОБЯЗАТЕЛЬНЫЙ ключ. Полный SHA коммита (ровно 40 символов: цифры 0-9 и буквы a-f в нижнем регистре)
# того состояния репозитория, которое вы скачали. Он записывается в план и в результаты.
# Где взять: страница репозитория на GitHub -> нужная ветка -> «Commits» -> у верхнего коммита кнопка копирования
# полного SHA. Скрипт никогда не запускает git и не читает zip-файл.
# Значение ДОЛЖНО быть в кавычках: без кавычек YAML может прочитать длинное число как число.
# Значение ниже - намеренная заглушка (не SHA): с ней скрипт остановится с сообщением, где взять SHA.
revision: "PUT-40-LOWERCASE-HEX-COMMIT-SHA-HERE"

# suite - файл набора экспериментов. Относительный путь считается от папки проекта (где лежат src/ и experiments/).
suite: configs/suite_paper_scope.json

# output_root - папка результатов: в ней создаются plan/, summary.json, plots/ и (с --debug) run_all.log.
# Относительный путь считается от папки проекта; можно указать абсолютный. Папка plan/ не должна существовать.
# КАЖДЫЙ полный запуск (и с --debug тоже) требует новой папки: повторный запуск с тем же output_root остановится на предварительной проверке (код 3), ничего не удаляя; для второго запуска укажите другой output_root в этом файле или параметр --output-root.
# Держите путь коротким, без пробелов и кириллицы и вне OneDrive/Dropbox (ограничение длины пути Windows).
output_root: outputs/run_001

# stages - какие стадии выполнить; порядок всегда такой: plan, train, execute, aggregate, plot.
# Можно переопределить в командной строке:  --stages plan,aggregate
#   plan      - записывает план (конфигурации и точные команды); обучения и расчётов не делает
#   train     - обучает модели GLR (тяжёлая стадия, нужны torch и torch_geometric)
#   execute   - выполняет все ячейки симуляции (самая долгая стадия, нужны numpy и torch, а при baselines_only: false - и torch_geometric)
#   aggregate - собирает summary.json из готовых ячеек
#   plot      - строит графики (нужен matplotlib)
stages: [plan, train, execute, aggregate, plot]

plan:
  # models - путь к JSON-файлу «N -> папка готового обучения» или null. Нужен, только если модели уже обучены.
  models: null
  # baselines_only - true: не планировать GLR (остаются TBR, TSR, CGR). Тогда стадия train пропускается
  # (скрипт печатает пояснение), а execute не требует torch_geometric.
  baselines_only: false
  # include_native_tbr - собственный ограниченный перебор TBR. С поставляемым набором (в нём есть policy_scope)
  # код отказывается его планировать: оставьте false.
  include_native_tbr: false
  # tbr_max_nodes, tbr_max_expansions - целые положительные границы; только вместе с include_native_tbr: true.
  tbr_max_nodes: null
  tbr_max_expansions: null

aggregate:
  # allow_partial - true разрешает собрать итог по неполному набору ячеек.
  allow_partial: false
  # reference - опорная политика для парных разностей. Допустимо: GLR, TBR_style_hop_oracle,
  # TSR_source_dijkstra, CGR_contact_plan, TBR_bounded_exhaustive_reference (последняя - только с native TBR).
  # GLR недопустим вместе с baselines_only: true.
  reference: TBR_style_hop_oracle

plot:
  # allow_partial - нужен только если summary.json неполный.
  allow_partial: false

run:
  # progress_interval_s - период строки [heartbeat] в секундах (число; 0 отключает). Строка показывает,
  # у скольких заданий появился файл status.json (по именам файлов, содержимое не читается).
  progress_interval_s: 60
