# config_ttl_p0.yaml - настройки для experiments/run_all.py: проба TTL, шаг P0 (КОНТРОЛЬ).
# Файл в кодировке UTF-8. Комментарии на русском языке допустимы: скрипт читает файл как UTF-8.
#
# СТАТУС: НИЧЕГО из этого авторы не запускали. Первый ваш запуск - это первая проверка.
#
# Что это. Это дополнение к проекту (папка probes/ttl/), его нет в корневом README. Набор
# probes/ttl/suite_ttl_p0_control.json планирует ТОЛЬКО политики TBR и TSR, только N = 132, только
# вероятности отказа p = 0.0 и p = 0.04, те же пять троек зерен (401-405 / 501-505 / 601-605), что и в вашем
# прошлом прогоне. CGR и GLR не планируются, обучение не нужно. Параметры симуляции НЕ меняются
# (ttl_s = 300 с, окно наблюдения 900 с): это контроль. Его сценарии должны совпасть с вашим прошлым
# прогоном по номерам сценариев, и все детерминированные числа (доли, число пакетов, число вызовов
# маршрутизации) должны совпасть с вашим прошлым summary.json для N = 132, p = 0 и p = 0.04.
# Если не совпали - остановитесь, шаги P1 и P2 не запускайте, и пришлите: новый outputs\ttl_p0\summary.json
# (ваш прежний summary.json уже лежит в папке репозитория User_results, повторно присылать его не нужно) и по
# одному result.json ячеек TSR и TBR шага P0 при p = 0.04:
# outputs\ttl_p0\plan\runs\s-<16 hex>--TSR_source_dijkstra\result.json и
# outputs\ttl_p0\plan\runs\s-<16 hex>--TBR_style_hop_oracle\result.json (значение p видно в config.json той же папки).
#
# Для чтения .yaml нужен пакет PyYAML:  pip install pyyaml
# Неизвестный ключ в этом файле считается ошибкой (так ловятся опечатки).
#
# ВАЖНО О РАЗМЕРЕ ЗАПУСКА (прочитайте до начала):
#   * Ячеек симуляции: 20 = 10 сценариев (2 значения p x 5 троек зерен) x 2 политики (TBR, TSR).
#   * ПРЕДУПРЕЖДЕНИЕ О ВРЕМЕНИ (ОЦЕНКА, не измерение): от 2.4 до примерно 9 минут на весь шаг P0.
#     Основание: измеренные вами числа для TBR при N = 132, p = 0.04 (среднее по пяти ячейкам, plot_data.json):
#     simulation_seconds 7.20 с и route_seconds_per_call 0.000226 с; это числа TBR, TSR здесь не измеряли.
#     Нижняя граница: 20 ячеек x 7.20 с = 144 с = 2.4 минуты (без запуска процесса). Ваш прошлый полный прогон -
#     162 ячейки за 50 мин 10 с, в среднем около 18.6 с на ячейку вместе с запуском процесса. Верхняя часть
#     диапазона (9 минут) - допущение до 25 с на ячейку (20 x 25 с = 500 с), не измерение.
#   * Стадия execute запускает ячейки строго одну за другой, без возобновления. Прерванный запуск
#     продолжить нельзя: выберите другой output_root или удалите папку вывода вручную (скрипт ничего не удаляет).
#   * Каждый полный запуск требует НОВОЙ папки output_root.
#
# --- Ключи ------------------------------------------------------------------

# revision - ОБЯЗАТЕЛЬНЫЙ ключ. Полный SHA коммита (ровно 40 символов: цифры 0-9 и буквы a-f в нижнем регистре)
# того состояния репозитория, которое вы скачали; так же, как в config.yaml. Значение ДОЛЖНО быть в кавычках.
# Значение ниже - намеренная заглушка (не SHA): с ней скрипт остановится с кодом 2 и сообщением, где взять SHA,
# в том числе при --dry-run. Замените ее до первого запуска.
revision: "PUT-40-LOWERCASE-HEX-COMMIT-SHA-HERE"

# suite - файл набора. Относительный путь считается от папки проекта (где лежат src/ и experiments/).
suite: probes/ttl/suite_ttl_p0_control.json

# output_root - папка результатов. Относительный путь считается от папки проекта. Папка plan/ внутри не должна существовать.
output_root: outputs/ttl_p0

# stages - только plan, execute, aggregate: обучения (train) и графиков (plot) здесь нет.
stages: [plan, execute, aggregate]

plan:
  models: null
  # baselines_only: true - GLR не планируется; вместе с policy_scope набора остаются только TBR и TSR.
  baselines_only: true
  include_native_tbr: false
  tbr_max_nodes: null
  tbr_max_expansions: null

aggregate:
  allow_partial: false
  # reference - опорная политика для парных разностей: TBR.
  reference: TBR_style_hop_oracle

plot:
  allow_partial: false

run:
  # progress_interval_s - период строки [heartbeat] в секундах; 0 отключает.
  progress_interval_s: 60
